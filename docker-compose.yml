# 拓扑:nginx(ip_hash)+ web×2(无状态)+ PG + Redis + 2×MCP。
# 差异(有意):镜像 = Temurin JRE(多阶段);MCP server 用 Spring profile 选择;
# schema 迁移由 Flyway 启动即执行(无需 AUTO_MIGRATE 门禁)。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billguard
      POSTGRES_PASSWORD: billguard
      POSTGRES_DB: billguard
    ports: ["127.0.0.1:5433:5432"]   # 仅本机:测试/评测直连
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billguard"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  bill-server:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["-Dspring.profiles.active=bill", "/app/mcp.jar"]
    environment: &web_env
      BILLGUARD_PG_URL: jdbc:postgresql://postgres:5432/billguard
      BILLGUARD_PG_USER: billguard
      BILLGUARD_PG_PASSWORD: billguard
      BILLGUARD_REDIS_URL: redis://redis:6379/0
      SPRING_DATA_REDIS_URL: redis://redis:6379/0
      # MCP 服务间共享密钥:server 端校验,web 端携带;未设置时默认值兜底(fail-closed 于过滤器)
      BILLGUARD_MCP_API_KEY: ${BILLGUARD_MCP_API_KEY:-local-dev-mcp-key}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8010/health"]
      interval: 5s
      retries: 10
      start_period: 20s

  work-item-server:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["-Dspring.profiles.active=work-item", "/app/mcp.jar"]
    environment: *web_env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8020/health"]
      interval: 5s
      retries: 10
      start_period: 20s

  web-1: &web
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["/app/web.jar"]
    environment:
      <<: *web_env
      SERVER_PORT: 8001
      BILLGUARD_BILL_MCP_URL: http://bill-server:8010/mcp
      BILLGUARD_WORK_ITEM_MCP_URL: http://work-item-server:8020/mcp
      BILLGUARD_MCP_ENABLED: "1"
      BILLGUARD_LLM_BASE_URL: ${BILLGUARD_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      BILLGUARD_LLM_MODEL: ${BILLGUARD_LLM_MODEL:-openai/gpt-4.1-mini}
      # API Key 透传:.env 写 API_KEY 即可(OPENROUTER_API_KEY 同样有效)
      SPRING_AI_OPENAI_API_KEY: ${API_KEY:-${OPENROUTER_API_KEY:-dummy-local}}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8001/api/health"]
      interval: 5s
      retries: 10
      start_period: 40s

  web-2:
    <<: *web
    environment:
      <<: *web_env
      SERVER_PORT: 8002
      BILLGUARD_BILL_MCP_URL: http://bill-server:8010/mcp
      BILLGUARD_WORK_ITEM_MCP_URL: http://work-item-server:8020/mcp
      BILLGUARD_MCP_ENABLED: "1"
      BILLGUARD_LLM_BASE_URL: ${BILLGUARD_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      BILLGUARD_LLM_MODEL: ${BILLGUARD_LLM_MODEL:-openai/gpt-4.1-mini}
      SPRING_AI_OPENAI_API_KEY: ${API_KEY:-${OPENROUTER_API_KEY:-dummy-local}}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8002/api/health"]
      interval: 5s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf"]
    depends_on: [web-1, web-2]

volumes:
  pgdata:
